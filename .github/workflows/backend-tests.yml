name: backend-tests

# Backend test suite for pull requests. Testcontainers-based tests need a
# Docker daemon, which the GitHub-hosted runners provide.
on:
  pull_request:
  push:
    branches: ["feat/authoring-*"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Backend tests
        run: cd server && ./mvnw -B test
