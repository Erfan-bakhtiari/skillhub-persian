services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    pull_policy: never
    ports: !override
      - "127.0.0.1:${API_PORT:-8080}:8080"
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    pull_policy: never
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:80"
  skill-scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    pull_policy: never
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
